name: Dependency Audit

on:
  schedule:
    # Runs at 02:42 UTC
    - cron: '42 2 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: Run pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check for consecutive failures
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          both_failed=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "nightly-audit.yml" \
            --limit 3 \
            --json conclusion \
            --jq '.[1:3] | map(.conclusion) | all(. == "failure")')
          if [ "$both_failed" = "true" ]; then
            echo "Last two runs both failed. Skipping to suppress noise."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pip-audit
        run: uv run pip-audit
