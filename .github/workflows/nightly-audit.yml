name: Dependency Audit

on:
  schedule:
    # Runs at 02:42 UTC
    - cron: '42 2 * * *'
  workflow_dispatch:

jobs:
  check-prev-run:
    name: Check previous run
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.prev-run.outputs.conclusion }}
    steps:
      - name: Get previous run conclusion
        id: prev-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/nightly-audit.yml/runs" \
            -F per_page=5 \
            --jq '.workflow_runs[1].conclusion')
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT

  audit:
    name: Run pip-audit
    needs: check-prev-run
    if: needs.check-prev-run.outputs.conclusion != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pip-audit
        run: uv run pip-audit
